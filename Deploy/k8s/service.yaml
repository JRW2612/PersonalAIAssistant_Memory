apiVersion: v1
kind: Service
metadata:
  name: memory-api-service
  namespace: bfsi-memory-prod
  labels:
    app: memory-api
    tier: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: memory-api
    tier: backend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: http-alt
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8081
      protocol: TCP
