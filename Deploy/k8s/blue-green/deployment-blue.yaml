apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-api-blue
  namespace: bfsi-memory-prod
  labels:
    app: memory-api
    tier: backend
    version: blue
    release: v1.0.0
spec:
  replicas: 5
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: memory-api
      tier: backend
      version: blue
  template:
    metadata:
      labels:
        app: memory-api
        tier: backend
        version: blue
        release: v1.0.0
    spec:
      serviceAccountName: memory-api-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: memory-api
          image: ghcr.io/jr-w/personal-ai-assistant-memory-api:v1.0.0-bfsi-certified
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          ports:
            - name: http
              containerPort: 80
            - name: http-alt
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: bfsi-memory-config
            - secretRef:
                name: bfsi-memory-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
