version: '3.8'

services:
  personal-ai-memory-api:
    build:
      context: .
      dockerfile: PersonalAIAssistant.Memory.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - UseInMemoryStore=false
      - ConnectionStrings__MongoEventStore=mongodb://mongo:27017
      - ConnectionStrings__PostgresReadModel=Host=postgres;Database=PersonalAiMemoryReadDb;Username=postgres;Password=postgres
      - Qdrant__Host=qdrant
      - Qdrant__Port=6334
      - Qdrant__Https=false
      - MessageBroker__Host=rabbitmq
      - MessageBroker__Username=guest
      - MessageBroker__Password=guest
    depends_on:
      - mongo
      - postgres
      - qdrant
      - rabbitmq
    restart: on-failure

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=PersonalAiMemoryReadDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.9.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  mongo_data:
  postgres_data:
  qdrant_data:
