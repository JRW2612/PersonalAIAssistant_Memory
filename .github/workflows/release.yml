name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore "PersonalAIAssistant.Memory.slnx"

      - name: Build
        run: dotnet build "PersonalAIAssistant.Memory.slnx" --configuration Release --no-restore

      - name: Pack
        run: |
          set -e
          dotnet pack "PersonalAIAssistant.Memory.slnx" -c Release -o ./artifacts --no-build

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        uses: actions/upload-release-asset@v2
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts
          asset_name: build-artifacts.zip
          asset_content_type: application/zip

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ env.GITHUB_TOKEN != '' }}
        run: |
          set -e
          for pkg in artifacts/*.nupkg; do
            echo "Pushing $pkg to GitHub Packages"
            dotnet nuget push "$pkg" -k ${{ secrets.GITHUB_TOKEN }} -s https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json || true
          done
