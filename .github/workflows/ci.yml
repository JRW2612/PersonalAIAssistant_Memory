name: CI

on:
  push:
    branches: [ main, Feature_MemoryManagement_Jayant ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: [ '8.0.x', '10.0.x' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Show dotnet info
        run: dotnet --info

      - name: Restore
        run: dotnet restore "PersonalAIAssistant.Memory.slnx"

      - name: Build
        run: dotnet build "PersonalAIAssistant.Memory.slnx" --configuration Release --no-restore

      - name: Test (with code coverage)
        run: |
          set -e
          # Run tests, produce TRX and XPlat coverage (coverage.cobertura.xml)
          dotnet test "PersonalAIAssistant.Memory.slnx" --configuration Release --no-build --logger "trx;LogFileName=test_results.trx" --collect:"XPlat Code Coverage"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test_results.trx'

      - name: Install reportgenerator
        uses: actions/cache@v4
        with:
          path: ~/.dotnet/tools
          key: dotnet-tools-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}

      - name: Install reportgenerator
        run: |
          set -e
          dotnet tool uninstall -g dotnet-reportgenerator-globaltool || true
          dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.1.34
          echo "::add-path::${HOME}/.dotnet/tools"

      - name: Generate coverage report
        run: |
          set -e
          mkdir -p coverage-report
          # Generate HTML, XML summary and lcov formats for downstream tools
          reportgenerator -reports:"**/coverage.cobertura.xml" -targetdir:coverage-report -reporttypes:Html;XmlSummary;lcov

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report

      - name: Upload raw coverage files
        uses: actions/upload-artifact@v4
        with:
          name: coverage-raw
          path: '**/coverage.cobertura.xml'

      - name: Send coverage to Codecov
        if: ${{ secrets.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: '**/coverage.cobertura.xml'
          flags: unittests
          fail_ci_if_error: false

      - name: Pack projects (create NuGet packages)
        run: |
          set -e
          dotnet pack "PersonalAIAssistant.Memory.slnx" -c Release -o ./artifacts --no-build || true

      - name: Upload packages/artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: artifacts

      - name: Publish NuGet packages
        if: ${{ secrets.NUGET_API_KEY != '' && startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -e
          for pkg in artifacts/*.nupkg; do
            echo "Pushing $pkg"
            dotnet nuget push "$pkg" -k ${{ secrets.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json || true
          done

      - name: Publish to GitHub Packages
        if: ${{ secrets.GITHUB_TOKEN != '' && startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -e
          for pkg in artifacts/*.nupkg; do
            echo "Pushing $pkg to GitHub Packages"
            dotnet nuget push "$pkg" -k ${{ secrets.GITHUB_TOKEN }} -s https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json || true
          done

      - name: Install dotnet-format (for style check)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/cache@v4
        with:
          path: ~/.dotnet/tools
          key: dotnet-tools-format-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}

      - name: Run dotnet-format (fail PR on formatting issues)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -e
          dotnet tool uninstall -g dotnet-format || true
          dotnet tool install -g dotnet-format --version 6.1.452
          echo "::add-path::${HOME}/.dotnet/tools"
          # --verify-no-changes exits with non-zero when formatting is required, which will fail the job
          dotnet format --verify-no-changes
