# automatic labeler mapping by path (actions/labeler v5 syntax)
"area: business":
  - changed-files:
      - any-glob-to-any-file: "PersonalAIAssistant.Memory.Business/**"

"area: infra":
  - changed-files:
      - any-glob-to-any-file: "PersonalAIAssistant.Memory.Infrastructure/**"

"area: tests":
  - changed-files:
      - any-glob-to-any-file: "**/Tests/**"

"area: docs":
  - changed-files:
      - any-glob-to-any-file: "docs/**"

"area: ci":
  - changed-files:
      - any-glob-to-any-file: ".github/**"
